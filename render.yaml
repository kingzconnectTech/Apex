services:
  - type: web
    name: apex-xgrw
    runtime: docker
    dockerfilePath: Dockerfile
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: PITCHAPI_ENABLED
        value: "true"
      # REQUIRED SECRETS - Set these in Render dashboard after deployment:
      # 1. FIREBASE_SERVICE_ACCOUNT_JSON (paste the full JSON service account key)
      # 2. PITCHAPI_KEY (your PitchAPI key from https://pitchapi.dev)
      # 3. SETTLEMENT_CRON_SECRET (generate a long random string for cron authentication)
    healthCheckPath: /health
    autoDeploy: true
    plan: free # or starter, standard, etc.
