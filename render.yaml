services:
  - type: web
    name: apex-xgrw
    runtime: docker
    dockerfilePath: Dockerfile
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      # Add these secrets in the Render dashboard:
      # - FIREBASE_SERVICE_ACCOUNT_JSON
      # - PITCHAPI_KEY / PITCHAPI_ENABLED=true
      # - SETTLEMENT_CRON_SECRET (protects POST /api/predictions/settle)
    healthCheckPath: /health
    autoDeploy: true
    plan: free # or starter, standard, etc.
